<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe 🎮</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="ttt-body-wrapper">
    <header class="game-header">
      <div class="header-container">
        <button id="resetBtn" class="header-btn">Again! 🔄</button>
        <h1 class="header-title">Tic Tac Toe</h1>
        <a href="index.html" class="header-btn nav-link-btn">GameNest 🏠</a>
      </div>
    </header>

    <main class="game-body-section">
      <div class="game-play-container">
        <div id="status" class="game-center-box">Player X</div>

        <div class="ttt-board">
          <div class="ttt-cell" data-index="0"></div>
          <div class="ttt-cell" data-index="1"></div>
          <div class="ttt-cell" data-index="2"></div>
          <div class="ttt-cell" data-index="3"></div>
          <div class="ttt-cell" data-index="4"></div>
          <div class="ttt-cell" data-index="5"></div>
          <div class="ttt-cell" data-index="6"></div>
          <div class="ttt-cell" data-index="7"></div>
          <div class="ttt-cell" data-index="8"></div>
        </div>
      </div>
    </main>

    <script src="tictactoe.js"></script>
  </body>
</html>
